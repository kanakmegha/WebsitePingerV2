services:
  postgres:
    image: postgres:15-alpine
    container_name: pinger_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pinger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pinger_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: pinger_api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/pinger?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      PORT: "4002"
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4002/health || exit 1" ]
      interval: 300s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: pinger_worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/pinger?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile.scheduler
    container_name: pinger_scheduler
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/pinger?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
